services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Comma-separated list of allowed origins for CORS/WebSocket
      # Add your domain here, e.g., localhost,myserver.com
      - ALLOWED_ORIGINS=localhost
      # Base directory for all data files (persisted via volume)
      - DATA_DIR=/data
      # Public URL of the client, used to build the redirect target for
      # join-room preview links (the client is a separate origin/port here)
      - PUBLIC_CLIENT_URL=http://localhost
      # This server's own public URL, used to build the og:image URL for
      # join-room preview links. No reverse-proxy prefix to account for in
      # this docker-compose setup, so it's just the direct port mapping -
      # see docs/BASE_PATH_SETUP.md for the k8s case, where this needs to
      # include the path prefix a proxy strips before forwarding here.
      - PUBLIC_SERVER_URL=http://localhost:8080
    volumes:
      # Persist data across container restarts
      - bouncebot-data:/data
    restart: unless-stopped

  client:
    build:
      context: client/web
      dockerfile: Dockerfile
      args:
        - VERSION=${APP_VERSION:-dev}
    ports:
      - "80:80"
    environment:
      - BASE_PATH=${BASE_PATH:-/}
      # nginx here has no /api proxy rule (that only exists in the separate
      # k8s ingress), so the client must call the server directly cross-port
      # rather than through a relative "/api" path.
      - API_BASE_URL=http://localhost:8080
    depends_on:
      - server
    restart: unless-stopped

volumes:
  bouncebot-data:
