name: Promote Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g. 1.0.0)'
        required: true
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - beta
          - prod

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      matrix:
        name: [server, client]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote ${{ matrix.name }} to ${{ inputs.environment }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          docker buildx imagetools create \
            ${{ env.REGISTRY }}/srsalisbury/bouncebot-${{ matrix.name }}:${VERSION} \
            --tag ${{ env.REGISTRY }}/srsalisbury/bouncebot-${{ matrix.name }}:${{ inputs.environment }}
